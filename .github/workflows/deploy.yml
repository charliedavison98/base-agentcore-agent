name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'cdk/**'
      - 'agent/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-serverless-backend
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  STAGE: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-ServerlessBackend
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Install CDK dependencies
        run: |
          cd cdk
          pip install -r requirements.txt

      - name: Install streaming lambda dependencies
        run: npm ci
        working-directory: cdk/lambda_functions/chat_streaming_node

      - name: Deploy Serverless Stack
        run: |
          cd cdk
          cdk deploy SimpleChatbot-${{ env.STAGE }} --context stage=${{ env.STAGE }} --require-approval never

      - name: Deploy frontend
        run: ./scripts/deploy_frontend.sh --stage ${{ env.STAGE }}

      - name: Display deployment info
        run: |
          STACK_NAME=SimpleChatbot-${{ env.STAGE }}
          WEBSITE_URL=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`WebsiteUrl`].OutputValue' --output text)
          echo "Backend and frontend deployed successfully"
          echo "Website: $WEBSITE_URL"
